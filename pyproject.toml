[project]
name = "zarvis"
version = "0.1.0"
description = "Open-source sales intelligence layer. Drafts, never sends."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "psycopg[binary]>=3.2",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
zarvis-ingest = "zarvis.ingest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zarvis"]

[tool.ruff]
line-length = 100
target-version = "py312"
